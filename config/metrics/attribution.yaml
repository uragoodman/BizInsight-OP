# Conservative, explicit attribution support. Unsupported metrics remain
# queryable for ordinary analysis; they simply cannot enter attribution.
metrics:
  gmv:
    scopes:
      platform:
        methods: [additive_change_v1, product_shapley_v1]
        dimensions: [customer_state, customer_city, seller_state, product_category]
        required_data:
          additive_change_v1: [baseline_total, current_total, baseline_group_totals, current_group_totals]
          product_shapley_v1: [baseline_factor_values, current_factor_values]
        factor_specs:
          product_shapley_v1:
            - factor_id: order_count
              kind: sum
              metric_id: order_count
            - factor_id: avg_order_value
              kind: ratio_of_sums
              numerator_metric: gmv
              denominator_metric: order_count
      seller:
        methods: [additive_change_v1]
        dimensions: [product_category, month_position]
        required_data:
          additive_change_v1: [baseline_total, current_total, baseline_group_totals, current_group_totals]
    limitation: "平台范围支持可加总维度拆解及 GMV=订单量×客单价的二因子 Shapley 展示；店铺范围仅支持专用查询已验证的品类和月内时段拆解。"
  order_count:
    scopes:
      platform:
        methods: [additive_change_v1, proportional_overlap_v1]
        dimensions: [customer_state, customer_city, seller_state, product_category]
        required_data:
          additive_change_v1: [baseline_total, current_total, baseline_group_totals, current_group_totals]
          proportional_overlap_v1: [baseline_total, current_total, baseline_group_totals, current_group_totals, allocation_method]
      seller:
        methods: [additive_change_v1, proportional_overlap_v1]
        dimensions: [product_category, month_position]
        required_data:
          additive_change_v1: [baseline_total, current_total, baseline_group_totals, current_group_totals]
          proportional_overlap_v1: [baseline_total, current_total, baseline_group_totals, current_group_totals, allocation_method]
    limitation: "非重叠维度支持可加总拆解；商品品类订单量按订单涉及的品类数比例分摊，结果为订单等价量，不等于各品类独立去重订单数。"
  freight_value:
    scopes:
      platform:
        methods: [additive_change_v1]
        dimensions: [customer_state, customer_city, seller_state, product_category]
        required_data:
          additive_change_v1: [baseline_total, current_total, baseline_group_totals, current_group_totals]
      seller:
        methods: [additive_change_v1]
        dimensions: [product_category, month_position]
        required_data:
          additive_change_v1: [baseline_total, current_total, baseline_group_totals, current_group_totals]
    limitation: "仅声明范围内已验证维度支持可加总拆解。"
  avg_order_value:
    scopes:
      platform:
        methods: [symmetric_ratio_v1, symmetric_mix_within_v1]
        dimensions: [month_position]
        required_data:
          symmetric_ratio_v1: [baseline_numerator, current_numerator, baseline_denominator, current_denominator]
          symmetric_mix_within_v1: [grouped_numerator, grouped_denominator, complete_group_population]
    limitation: "平台报告快照同时包含成交总额与订单量时，可对客单价进行分子/分母对称分解；平台一行一订单事实表支持按月内日期位置进行组内/构成分解；不支持商品或支付方式拆解，也不作因果解释。"
  freight_rate:
    scopes:
      platform:
        methods: [symmetric_ratio_v1, symmetric_mix_within_v1]
        dimensions: [month_position]
        required_data:
          symmetric_ratio_v1: [baseline_numerator, current_numerator, baseline_denominator, current_denominator]
          symmetric_mix_within_v1: [grouped_numerator, grouped_denominator, complete_group_population]
    limitation: "平台范围可用报告快照作分子/分母分解，并可按月初/月中/月末完整订单分组作组内/构成分解；不支持商品、卖家或支付方式拆解，也不作因果解释。"
  review_score_avg:
    scopes: {}
    limitation: "平均评分尚无可验证的分组分子、分母归因查询。"
  bad_review_rate:
    scopes: {}
    limitation: "差评率尚无可验证的组内率与构成效应查询契约。"
  cancel_rate:
