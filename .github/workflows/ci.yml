name: quality-gate

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: codex_test_perf_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d codex_test_perf_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.15.1
        ports:
          - 6333:6333
    env:
      POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/codex_test_perf_ci
      ISOLATED_TEST_POSTGRES_ADMIN_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      BIZINSIGHT_TEST_TEMPLATE_DB: codex_test_template_ci
      PHASE6_BENCHMARK_SERIES_P95_MS: "50"
      PHASE6_BENCHMARK_CONTRIBUTION_P95_MS: "50"
      PHASE6_BENCHMARK_REPORT_P95_MS: "250"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pip install -r requirements-mem0.txt
      - name: Build schema-only PostgreSQL test template
        run: python scripts/build_test_template.py --recreate --database codex_test_template_local
      - name: Build deterministic seeded PostgreSQL test template
        run: python scripts/build_seeded_test_template.py --recreate --database codex_test_template_seeded_local
      - name: Validate preference monitoring and Compose configuration
        run: |
          docker run --rm --entrypoint promtool -v "${GITHUB_WORKSPACE}/deploy:/etc/prometheus:ro" prom/prometheus:v3.4.1 check config /etc/prometheus/prometheus.yml
          cp .env.example .env
          docker compose -f deploy/docker-compose.yml config --quiet
          rm -f .env
      - run: python -m scripts.seed_phase6_ci_postgres
      - run: python -m alembic upgrade head
      - run: python -m scripts.seed_phase7_ci_postgres
      - run: python -m scripts.benchmark_phase7_postgres
      - run: python -m evaluation.phase7
      - run: python -m scripts.demo_phase7
      - run: ruff check app evaluation tests scripts --select E9,F63,F7,F82
      - name: mypy (advisory until baseline is clean)
        continue-on-error: true
        run: mypy app/agents/contracts.py app/agents/planner.py app/agents/alert_agent.py app/analysis app/api/routes/analysis.py app/mcp/tools.py app/mcp/remote_client.py app/rag/release.py app/security/governance.py --ignore-missing-imports
      - run: python -m compileall app evaluation migrations scripts
      - name: Complete test suite through isolated shard manifest
        run: python scripts/run_test_shards.py --jobs 2 docs/testing/shards/full.json
      - run: python -m evaluation.runner
      - run: python -m scripts.benchmark_phase6
      - run: alembic upgrade head --sql > migration.sql
      - run: docker build -t bizinsight-agent:${{ github.sha }} .

  frontend-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check:events
        working-directory: web
      - run: npx vue-tsc --noEmit
        working-directory: web
      - run: npm run build
        working-directory: web

  postgres-performance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: codex_test_perf_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d codex_test_perf_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/codex_test_perf_ci
      PHASE6_POSTGRES_MIN_FACT_ROWS: "90000"
      PHASE6_POSTGRES_METRIC_P95_MS: "5000"
      PHASE6_POSTGRES_CONTRIBUTION_P95_MS: "5000"
      PHASE6_POSTGRES_REPORT_P95_MS: "15000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python -m scripts.seed_phase6_ci_postgres
      - run: python -m alembic upgrade head
      - run: python -m scripts.benchmark_phase6_postgres

  mem0-qdrant:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.15.1
        ports:
          - 6333:6333
    env:
      MEM0_TEST_QDRANT_URL: http://127.0.0.1:6333
      MEM0_TEST_HMAC_SECRET: ci-only-wp3-hmac-secret-0123456789abcdef
      MEM0_TEST_HISTORY_DB: /tmp/wp3-mem0-history.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-dev.txt -r requirements-mem0.txt
      - name: Wait for Qdrant 1.15.1
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:6333/ >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: python scripts/run_test_shard.py --shard no-db --name mem0-qdrant -- tests/test_mem0_security.py tests/test_mem0_failure_semantics.py tests/test_mem0_qdrant_contract.py tests/test_mem0_qdrant_snapshot.py -q
